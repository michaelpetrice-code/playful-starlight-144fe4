<!doctype html><html lang="en-GB" class="local-dark-gold"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>The Local — unpublished design preview</title><link rel="stylesheet" href="social-experience.css?v=260"><style>body{margin:0;background:#080f0b;color:#f1f0e6;font-family:system-ui,sans-serif}*{box-sizing:border-box}a{color:#d9bc77}button{cursor:pointer;font:inherit;background:#172b1e;color:#ebd08c;border:1px solid #9c804c88;border-radius:10px;padding:10px;min-height:44px}h1,h2,h3{font-family:Georgia,serif}main{max-width:1120px;margin:auto;padding:24px}.preview-notice{padding:10px 16px;background:#282416;color:#f2dfaa;font-size:.8rem;text-align:center}.preview-notice a{margin:0 10px}.local-app-header{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;background:#102017;border-bottom:1px solid #9c804c66}.tl-header-logo{margin:0}.tl-header-logo img{width:160px;height:44px;object-fit:contain}.local-feed-post,.local-compose-card{background:linear-gradient(145deg,#1b2b1f,#0e1911);border:1px solid #9c804c66;border-radius:16px;padding:16px;margin-bottom:16px}.local-post-by{display:flex;gap:12px;align-items:center}.local-post-by small{display:block;color:#bcc7bb}.local-feed-image img{width:100%;object-fit:cover}.local-post-buttons{display:flex;gap:12px;margin-top:12px}.local-post-buttons button{flex:1}.local-compose-launch{width:100%;display:flex;text-align:left;gap:12px;align-items:center}.local-compose-launch span:last-child{flex:1;border:1px solid #9c804c66;border-radius:24px;padding:12px;background:#0b190f}.local-compose-actions{display:flex;gap:12px}.local-compose-actions button{flex:1}#moreDrawer{position:fixed;inset:100px 24px auto auto;z-index:10020;background:#13271a;border:1px solid #d9bc77;padding:18px;border-radius:16px;max-height:70vh;overflow:auto}#moreMenu button{display:block;width:100%;text-align:left;margin:6px 0}#bottomNav{position:fixed;bottom:0;left:0;right:0;padding:8px;display:flex;background:#102017;gap:5px;z-index:1000}#bottomNav button{flex:1;font-size:.75rem}#view{padding-bottom:90px}</style></head><body><div class="preview-notice">Unpublished design preview · Sample content · No live account or transactions <a href="social-preview.html">Visitor view</a><a href="social-preview.html?mode=member">Member view</a></div><header class="local-app-header"><h1 class="tl-header-logo"><img src="assets/branding/the-local-transparent-v150.png" alt="The Local"></h1><a href="index.html?register=1">Join free</a></header><main id="view"></main><div id="moreDrawer" hidden><label>Find a feature <input id="moreSearch" type="search"></label><button id="closeMore">Close</button><div id="moreMenu"></div></div><nav id="bottomNav"><button data-page="Home">Home</button><button data-page="Virtual Pub Tables">Tables</button><button data-page="Who’s Up for It?">Plans</button><button data-page="Private Chats">Messages</button><button id="moreNav">More</button></nav><script type="module">
import {featureGallery,visitorIntroduction,features} from './social-features.js?v=260';
import {createSocialExperience} from './social-experience.js?v=260';
const view=document.getElementById('view'),member=new URLSearchParams(location.search).get('mode')==='member';
const openPage=page=>{const item=features.find(f=>f.page===page);view.innerHTML='<section class="local-feed-post"><span class="social-eyebrow">Sample preview</span><h1></h1><p></p><a href="social-preview.html?mode=member">← Back to member preview</a></section>';view.querySelector('h1').textContent=page;view.querySelector('p').textContent=item?.description||'This section uses your existing account and permissions in the application. The design preview does not sign in or change any data.';document.getElementById('moreDrawer').hidden=true;};
if(member){
view.innerHTML=`<div class="community-home"><section class="community-home-heading"><p id="local46-greeting">Good to see you</p><h1 id="community-home-title">Your community</h1><nav class="community-home-shortcuts"><button data-page="Venue Hub">Find a Local</button><button data-page="Who’s Up for It?">Make plans</button><button data-page="Virtual Pub Tables">My tables</button></nav></section><section class="local-compose-card"><button class="local-compose-launch" data-page="Create Post"><span class="social-table-avatar">M</span><span>What’s happening locally?</span></button><div class="local-compose-actions"><button data-page="Create Post">Photo</button><button data-page="Who’s Up for It?">Event</button></div></section><article class="local-feed-post"><div class="local-post-by"><span class="social-table-avatar">C</span><div><strong>Coombe Social Club</strong><small>Illustrative post · Preview only</small></div></div><p>Good company starts at your Local. What are your plans this weekend?</p><div class="local-feed-image"><img src="assets/feature-slides/virtual-pub-tables.webp" width="504" height="333" alt="Illustration of friends at a pub"></div><div class="local-post-buttons"><button data-page="Local Updates">Like</button><button data-page="Local Updates">Comment</button><button data-page="Local Updates">Share</button></div></article>${featureGallery({member:true})}</div>`;
const shell=createSocialExperience({openPage,openTable:()=>openPage('Virtual Pub Tables')});shell.update({user:{id:'sample-preview'},groupId:'sample-preview',profileName:'Michael · Sample',tab:'Home',records:[]});
}else{view.innerHTML=visitorIntroduction()+featureGallery();document.getElementById('bottomNav').hidden=true;}
document.querySelectorAll('[data-page],[data-go]').forEach(b=>b.onclick=()=>openPage(b.dataset.page||b.dataset.go));document.getElementById('moreNav').onclick=()=>{const d=document.getElementById('moreDrawer');d.hidden=!d.hidden};document.getElementById('closeMore').onclick=()=>document.getElementById('moreDrawer').hidden=true;document.getElementById('moreMenu').innerHTML=features.map(f=>`<button data-feature="${f.id}">${f.name}</button>`).join('');document.querySelectorAll('[data-feature]').forEach(b=>b.onclick=()=>openPage(features.find(f=>f.id===b.dataset.feature).page));document.getElementById('moreSearch').oninput=e=>document.querySelectorAll('[data-feature]').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(e.target.value.toLowerCase()));
</script></body></html>
