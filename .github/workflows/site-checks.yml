name: The Local - source checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Static site and JavaScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public pages and guest navigation
        run: python scripts/check_static.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Check venue sector compatibility and rendering
        run: node venue-sectors.test.mjs
      - name: Check cue physics and referee rules
        run: |
          node cue-physics-v94.test.mjs
          node cue-referee-v95.test.mjs

      - name: Check football rules, provider validation and QR rendering
        run: node --test football/rules.test.mjs football/model.test.mjs venue-setup-guide.test.mjs

      - name: Check message notifications, table access and invitations
        run: node --test tests/native-push.test.cjs tests/message-alerts.test.cjs tests/table-chat-entry.test.cjs tests/table-message-visibility.test.cjs tests/table-invitations.test.cjs

      - name: Install DOM regression test dependency
        run: npm ci --prefix tests --ignore-scripts
      - name: Check social navigation, drafts and private chat lifecycle
        run: node --test tests/social-flow.test.cjs tests/table-attachments.test.cjs
