name: LocalLaunch manual checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run hosting and backup checks
        working-directory: tools/locallaunch
        run: python -m unittest -v test_server.py
      - name: Build evaluation image
        working-directory: tools/locallaunch
        run: docker build -t locallaunch-check .
